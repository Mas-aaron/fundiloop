<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FundiLoop</title>
<style>
  :root {
    --bg: #111;
    --panel: #1b1e24;
    --line: #2c313a;
    --ink: #f2f4f8;
    --dim: #9aa3b2;
    --accent: #35d07f;
    --danger: #e5484d;
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    margin: 0; padding: 0 1rem 2rem;
    background: var(--bg); color: var(--ink);
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center;
  }
  main { width: 100%; max-width: 32rem; display: flex; flex-direction: column; align-items: center; }

  /* Top bar */
  .topbar {
    width: 100%; max-width: 32rem;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.9rem 0.25rem;
  }
  .logo { font-size: 1.25rem; font-weight: 800; letter-spacing: 0.2px; margin: 0; }
  .icon-btn {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    width: 3rem; height: 3rem; display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--ink);
  }
  .icon-btn svg { width: 1.4rem; height: 1.4rem; }

  /* Mode chips */
  .mode-row { display: flex; gap: 0.5rem; margin: 0.25rem 0 0.5rem; }
  .mode {
    background: var(--panel); color: var(--dim);
    border: 1px solid var(--line); border-radius: 999px;
    min-height: 2.75rem; padding: 0 1.25rem; font-size: 1rem; font-weight: 700; cursor: pointer;
  }
  .mode.active { color: var(--ink); border-color: var(--accent); }

  /* Status label */
  #status {
    font-size: clamp(1.4rem, 6vw, 2rem); font-weight: 700; text-align: center;
    min-height: 3rem; margin: 0.5rem 0 0.25rem; padding: 0 1rem;
    overflow-wrap: break-word;
  }

  /* Orb: vibration on outer wrap (JS), pulse/glow on inner (CSS) */
  #orb-vibe { will-change: transform; }
  #orb {
    position: relative; width: 11rem; height: 11rem; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #7ce8b5 0%, #2fae72 32%, #134a37 68%, #0b1f19 100%);
    box-shadow: 0 0 2.5rem rgba(53, 208, 127, 0.35), inset 0 0 2rem rgba(0, 0, 0, 0.45);
    animation: breathe 4s ease-in-out infinite;
  }
  #orb::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0 70%, rgba(255, 255, 255, 0.35) 82%, transparent 94%);
    opacity: 0;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); opacity: 0.8; }
    50% { transform: scale(1.05); opacity: 1; }
  }
  @keyframes pulse-fast {
    0%, 100% { transform: scale(1); opacity: 0.9; }
    50% { transform: scale(1.1); opacity: 1; }
  }
  @keyframes spin-sheen { to { transform: rotate(360deg); } }
  #orb.is-listening {
    background: radial-gradient(circle at 35% 30%, #c9b8ff 0%, #6a5cff 38%, #2a2370 72%, #12102a 100%);
    box-shadow: 0 0 3.5rem rgba(122, 102, 255, 0.65), inset 0 0 2rem rgba(0, 0, 0, 0.4);
    animation: pulse-fast 1.1s ease-in-out infinite;
  }
  #orb.is-thinking {
    background: radial-gradient(circle at 35% 30%, #ffc9a8 0%, #e85d2a 42%, #6e2a12 78%, #241009 100%);
    box-shadow: 0 0 3rem rgba(232, 93, 42, 0.55), inset 0 0 2rem rgba(0, 0, 0, 0.4);
    animation: breathe 2.4s ease-in-out infinite;
  }
  #orb.is-thinking::after { opacity: 1; animation: spin-sheen 3.2s linear infinite; }
  #orb.is-speaking {
    background: radial-gradient(circle at 35% 30%, #a8ffe0 0%, #35d07f 38%, #14573a 74%, #08160f 100%);
    box-shadow: 0 0 3.5rem rgba(53, 208, 127, 0.7), inset 0 0 2rem rgba(0, 0, 0, 0.35);
    animation: pulse-fast 0.7s ease-in-out infinite;
  }
  #orb.is-error {
    background: radial-gradient(circle at 35% 30%, #ffb3b6 0%, #e5484d 42%, #6e1418 78%, #22090b 100%);
    box-shadow: 0 0 3rem rgba(229, 72, 77, 0.65), inset 0 0 2rem rgba(0, 0, 0, 0.4);
    animation: none;
  }

  /* Mic button: large circular target */
  #talk {
    margin-top: 1.5rem; width: 6rem; height: 6rem; min-width: 80px; min-height: 80px;
    border-radius: 50%; border: 0; cursor: pointer;
    background: var(--accent); color: #08130c;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.1rem;
    font-size: 0.7rem; font-weight: 800; letter-spacing: 0.4px;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #talk svg { width: 1.9rem; height: 1.9rem; }
  #talk.rec { background: var(--danger); color: #fff; }
  .mic-hint { color: var(--dim); font-size: 0.85rem; margin: 0.4rem 0 0; }

  /* Secondary actions */
  .btn-row { display: flex; gap: 0.6rem; margin-top: 1rem; width: 100%; }
  .small {
    flex: 1; min-height: 3rem; font-size: 0.95rem; font-weight: 800; letter-spacing: 0.3px;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 12px; cursor: pointer;
  }
  .small.off { color: var(--dim); }

  /* Learn progress */
  #learn-progress { margin-top: 1rem; text-align: center; }
  #learn-step { font-size: 1.1rem; font-weight: 800; }
  #learn-dots { display: flex; gap: 0.4rem; justify-content: center; margin-top: 0.5rem; min-height: 0.6rem; }
  #learn-dots span { width: 0.6rem; height: 0.6rem; border-radius: 50%; background: var(--accent); }
  #learn-dots span.todo { background: var(--line); }

  /* Typed fallback */
  #typed-fallback {
    width: 100%; margin-top: 1rem; background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px; padding: 0.8rem;
  }
  #typed-msg { color: var(--dim); font-size: 0.85rem; margin-bottom: 0.5rem; }
  #typed-fallback .row { display: flex; gap: 0.5rem; }
  input[type="text"], textarea {
    background: #0c0e12; color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px;
    font-size: 1rem; padding: 0.7rem; width: 100%;
  }
  #typed { flex: 2; }
  #send-typed { flex: 1; min-height: 3rem; font-weight: 800; border-radius: 10px; border: 0; background: var(--accent); color: #08130c; cursor: pointer; }

  /* Log panel */
  #log-wrap { width: 100%; max-width: 32rem; margin-top: 1.25rem; }
  #log-toggle {
    width: 100%; min-height: 3rem; background: var(--panel); color: var(--dim);
    border: 1px solid var(--line); border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer;
  }
  #log-panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 0.8rem; margin-top: 0.5rem; }
  .turn { background: #0c0e12; border: 1px solid var(--line); border-radius: 10px; padding: 0.7rem; margin: 0.5rem 0; font-size: 0.9rem; line-height: 1.5; }
  .turn.empty { color: var(--dim); }
  #log-status { white-space: pre-wrap; font-size: 0.85rem; color: var(--dim); margin: 0.5rem 0; }
  #log-preview { width: 100%; border-radius: 10px; margin-top: 0.5rem; }
  #log-cam-status, #cam-line { font-size: 0.8rem; color: var(--dim); margin: 0.3rem 0; overflow-wrap: break-word; }
  #manual { min-height: 3.5rem; font-size: 0.8rem; margin-top: 0.5rem; font-family: ui-monospace, monospace; }
  label.fine { font-size: 0.8rem; color: var(--dim); display: block; margin-top: 0.6rem; }

  /* Settings modal */
  #settings-modal {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(0, 0, 0, 0.7);
    display: flex; align-items: center; justify-content: center; padding: 1rem;
  }
  #settings-modal[hidden] { display: none; }
  .modal-card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 1.25rem; width: 100%; max-width: 22rem; }
  .modal-card h2 { margin: 0 0 0.75rem; font-size: 1.2rem; }
  #settings-msg { font-size: 0.85rem; color: var(--dim); margin: 0.5rem 0; min-height: 1.2rem; }

  [hidden] { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    #orb, #orb.is-listening, #orb.is-thinking, #orb.is-speaking { animation: none; }
    #orb.is-thinking::after { animation: none; }
  }
</style>
</head>
<body>
<header class="topbar">
  <h1 class="logo">FundiLoop</h1>
  <button id="settings-btn" class="icon-btn" type="button" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</header>

<main>
  <div class="mode-row" role="tablist" aria-label="Mode">
    <button id="mode-fix" class="mode active" type="button">Fix</button>
    <button id="mode-learn" class="mode" type="button">Learn</button>
  </div>

  <div id="status" role="status">Ready</div>

  <div id="orb-vibe"><div id="orb" aria-hidden="true"></div></div>

  <button id="talk" type="button" aria-label="Hold to talk">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 19v3"/></svg>
    <span>HOLD TO TALK</span>
  </button>
  <p class="mic-hint">hold, speak, release</p>

  <div id="learn-progress" hidden>
    <div id="learn-step">Step 1</div>
    <div id="learn-dots"></div>
  </div>

  <div class="btn-row">
    <button id="check" class="small" type="button">CHECK NOW</button>
    <button id="mute" class="small" type="button">MUTE</button>
  </div>

  <div id="typed-fallback" hidden>
    <div id="typed-msg">Microphone unavailable — type instead:</div>
    <div class="row">
      <input id="typed" type="text" placeholder="type what you would say" autocomplete="off">
      <button id="send-typed" type="button">Send</button>
    </div>
  </div>
</main>

<section id="log-wrap">
  <button id="log-toggle" type="button"><span id="log-chevron">▸</span> Log</button>
  <div id="log-panel" hidden>
    <div id="cam-line">cam: …</div>
    <div id="turns"><div class="turn empty">No turns yet.</div></div>
    <div id="log-status">state: —</div>
    <img id="log-preview" hidden alt="last captured frame">
    <div id="log-cam-status"></div>
    <div class="btn-row">
      <button id="log-test-cam" class="small" type="button">TEST CAMERA</button>
      <button id="log-reset" class="small" type="button">RESET</button>
    </div>
    <label class="fine" for="manual">Manual probe JSON (optional, overrides /probe):</label>
    <textarea id="manual" placeholder='{"found":["0x3C"],"missing":["0x76"],"raw":"manual","timestamp":""}'></textarea>
  </div>
</section>

<div id="settings-modal" hidden>
  <div class="modal-card" role="dialog" aria-label="Settings">
    <h2>Settings</h2>
    <label class="fine" for="host">Camera host (mDNS name or IP):</label>
    <input id="host" type="text" value="fundiloop.local" autocomplete="off">
    <div id="settings-msg"></div>
    <div class="btn-row">
      <button id="save-host" class="small" type="button">Save</button>
      <button id="settings-close" class="small" type="button">Close</button>
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
